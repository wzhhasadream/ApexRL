<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" width="400" height="96" role="img" aria-label="ApexRL">
  <defs>
    <linearGradient id="peak" x1="10" y1="86" x2="86" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="curve" x1="33" y1="72" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <!-- Mark: the apex (also an "A") with a rising learning curve inside -->
  <path d="M14 84 L48 14 L82 84" fill="none" stroke="url(#peak)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 72 C 39 72, 41 62, 45.5 61 S 51 55.5, 54 52" fill="none" stroke="url(#curve)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="54" cy="52" r="5.5" fill="#F43F5E"/>
  <!-- Wordmark -->
  <text x="108" y="72" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#0F172A">Apex<tspan fill="url(#word)">RL</tspan></text>
</svg>
