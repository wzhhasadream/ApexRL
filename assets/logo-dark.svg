<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" width="760" height="192" role="img" aria-label="ApexRL">
  <title>ApexRL</title>
  <defs>
    <linearGradient id="peak" x1="28" y1="164" x2="164" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="curve" x1="64" y1="141" x2="112" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <!-- Mark: the apex (also an "A") with a rising learning curve inside -->
  <path d="M28 164 L96 28 L164 164" fill="none" stroke="url(#peak)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 141 C76 141, 80 122, 89 120 S104 109, 112 102" fill="none" stroke="url(#curve)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="112" cy="102" r="8.5" fill="#FB7185"/>
  <!-- Wordmark -->
  <text x="208" y="151" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="140" font-weight="800" letter-spacing="-3" fill="#F1F5F9">Apex<tspan fill="url(#word)">RL</tspan></text>
</svg>
